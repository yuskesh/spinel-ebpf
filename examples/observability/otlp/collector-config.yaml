# OpenTelemetry Collector configuration -- receives the spinel-ebpf OTLP export.
#
# The minimum needed for a real Collector to accept OTLP/HTTP+protobuf from
# spinel-ebpf. The debug exporter prints what arrives to stdout in full, which
# is what makes this useful for checking that the transport works.
#
# Starting it (docker example):
#   docker run --rm -p 4318:4318 -p 4317:4317 \
#     -v "$PWD/examples/observability/otlp/collector-config.yaml:/etc/otelcol/config.yaml" \
#     otel/opentelemetry-collector-contrib:latest --config /etc/otelcol/config.yaml
#
# On the sending side, point the send test at the real Collector:
#   OTLP_PORT=4318 OTLP_NO_MOCK=1 sh tests/runtime/run_otlp_send.sh

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
